name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            run_fmt: true
          - os: macos-15-intel
            run_fmt: false
          - os: macos-15
            run_fmt: false
          - os: windows-2022
            run_fmt: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up static OpenSSL
        uses: ./.github/actions/setup-openssl

      - name: Check formatting
        if: ${{ matrix.run_fmt }}
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Run clippy
        if: ${{ matrix.run_fmt }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run fuzz smoke
        if: ${{ matrix.run_fmt }}
        run: cargo run --manifest-path fuzz/Cargo.toml --bin fuzz_smoke --locked

      - name: Check libFuzzer targets
        if: ${{ matrix.run_fmt }}
        run: cargo check --manifest-path fuzz/Cargo.toml --bins --features libfuzzer --locked

  release-artifacts:
    name: Release artifact ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-musl
            os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            builder: cargo
            emulator: ""
            run_smoke: true
            macosx_deployment_target: ""
            rustflags: ""
          - name: linux-aarch64-musl
            os: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            builder: cross
            emulator: qemu-aarch64-static
            run_smoke: true
            macosx_deployment_target: ""
            rustflags: ""
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            builder: cargo
            emulator: ""
            run_smoke: true
            macosx_deployment_target: "10.12"
            rustflags: ""
          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            builder: cargo
            emulator: ""
            run_smoke: true
            macosx_deployment_target: "11.0"
            rustflags: ""
          - name: windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            builder: cargo
            emulator: ""
            run_smoke: true
            macosx_deployment_target: ""
            rustflags: "-C target-feature=+crt-static"
          - name: windows-aarch64
            os: windows-2022
            target: aarch64-pc-windows-msvc
            builder: cargo
            emulator: ""
            run_smoke: false
            macosx_deployment_target: ""
            rustflags: "-C target-feature=+crt-static"

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build and smoke test release artifact
        uses: ./.github/actions/build-release-artifact
        with:
          target: ${{ matrix.target }}
          archive: tzap-ci-${{ matrix.name }}.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}
          builder: ${{ matrix.builder }}
          emulator: ${{ matrix.emulator }}
          run_smoke: ${{ matrix.run_smoke }}
          macosx_deployment_target: ${{ matrix.macosx_deployment_target }}
          rustflags: ${{ matrix.rustflags }}
